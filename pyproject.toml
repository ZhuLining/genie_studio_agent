[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsa-taskflow-executor"
version = "0.1.0"
description = "Self-developed dry-run taskflow executor for GSA workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "GSA Taskflow Executor Team" }
]
dependencies = [
  "paho-mqtt>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-PyYAML>=6.0,<7.0"
]

[project.scripts]
gsa-taskflow-executor = "gsa_taskflow_executor.cli:main"
gsa-taskflow-e2e = "gsa_taskflow_executor.e2e_probe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["gsa_taskflow_executor"]
