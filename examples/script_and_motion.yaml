start_node: 开始
app_execution_id: sample-code-and-motion-run
nodes:
  - id: 开始
    type: assign
    assignments: {}
  - id: 代码
    type: worker
    skill_name: script_skill
    params_template:
      script_id: code_echo_inputs
      input_mappings:
        - name: out_1
          type: string
          variable_ref: $.variables.system.detail.outputs.app_execution_id
      output_variables:
        - name: out_1
          type: string
      timeout: 50
    capture_state_detail: true
    output_var: 代码
    output_contract:
      required_paths:
        - $.variables.代码.detail
  - id: 位姿调整-位控
    type: worker
    skill_name: motion_plan_skill
    params_template:
      right_arm:
        control_type: ABS_JOINT
        action_data:
          - 0.282
          - -1.039
          - -0.304
          - -1.751
          - -0.621
          - -0.169
          - 1.122
      speed: 0.05
      timeout: 50
    capture_state_detail: true
    output_var: 位姿调整-位控
    output_contract:
      required_paths:
        - $.variables.位姿调整-位控.detail
  - id: 结束
    type: assign
    assignments: {}
transitions:
  - from: 开始
    outcome: success
    to: 代码
  - from: 代码
    outcome: success
    to: 位姿调整-位控
  - from: 位姿调整-位控
    outcome: success
    to: 结束
